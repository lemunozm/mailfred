[package]
name = "mailfred"
authors = ["lemunozm <lemunozm@gmail.com>"]
version = "0.1.2"
edition = "2021"
readme = "README.md"
license = "Apache-2.0"
description = "Process emails as an HTTP server"
homepage = "https://github.com/lemunozm/mailfred"
repository = "https://github.com/lemunozm/mailfred"
keywords = ["imap", "smtp", "server", "email", "service"]
categories = ["asynchronous", "email", "web-programming"]

[features]
default = ["smtp", "imap"]
full = ["smtp", "imap", "logger"]

smtp = ["dep:mail-send", "dep:mail-builder", "dep:tokio-rustls"]
imap = ["dep:imap", "dep:mail-parser", "dep:native-tls"]
logger = ["dep:fern", "dep:colored", "dep:chrono"]

[package.metadata.cargo-all-features]
denylist = ["full"] # it's just an alias, we do not want to permute over it

[dependencies]
tokio = { version = "1", features = [
  "rt",
  "macros",
  "sync",
  "time",
  "rt-multi-thread",
] }
async-trait = "0.1"
log = "0.4"
anyhow = "1"

# smtp
# `dkim` is intentionally out of the feature list: mailfred never signs the
# messages it sends, and that feature pulls a whole DNS resolver to do it.
# `ring` is chosen over the default `aws_lc_rs` to keep the C toolchain out of
# the build, as the previous version of this dependency did.
mail-send = { version = "0.6", default-features = false, features = [
  "builder",
  "ring",
  "tls12",
  "cram-md5",
  "digest-md5",
], optional = true }
mail-builder = { version = "0.4", optional = true }
# Only used to name the stream type of the smtp connection, so it does not need
# a crypto provider of its own: `mail-send` already selects one.
tokio-rustls = { version = "0.26", default-features = false, optional = true }

# imap
# Pinned exactly: the 3.0 line is still a prerelease and its API changes
# between alphas. It is nevertheless preferred over the last stable (2.4.1,
# from 2021), which predates the whole 3.0 line and is no longer maintained.
imap = { version = "=3.0.0-alpha.15", optional = true }
mail-parser = { version = "0.8", optional = true }
native-tls = { version = "0.2", optional = true }

# logger
fern = { version = "0.6", features = ["colored"], optional = true }
colored = { version = "2.0", optional = true }
chrono = { version = "0.4", optional = true }

[dev-dependencies]
serial_test = "2.0"
doc-comment = "0.3"
csv = "1.2"

[[test]]
name = "integration_transports"
required-features = ["imap", "smtp"]

[[example]]
name = "basic"
required-features = ["imap", "smtp"]

[[example]]
name = "gmail"
required-features = ["imap", "smtp"]

[[example]]
name = "clean_sent_folder"
required-features = ["imap", "smtp"]

[[example]]
name = "router"
required-features = ["imap", "smtp"]
